<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Task 1: Avatar badge</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f4f4f4;
  }

  .avatar-wrap {
    width: 80px;
    height: 80px;
    position: relative;
  }

  .avatar-wrap img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }

  .badge {
    background: crimson;
    color: white;
    font-size: 12px;
    font-weight: bold;
    min-width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;

    position: absolute;
    top: -4px;
    right: -4px;
  }
</style>
</head>
<body>

  <div class="avatar-wrap">
    <img src="https://i.pravatar.cc/150?img=12" alt="User avatar" />
    <span class="badge">3</span>
  </div>

</body>
</html>
