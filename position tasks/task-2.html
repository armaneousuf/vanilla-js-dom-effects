<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Task 2: Tooltip on hover</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f4f4f4;
  }

  .tooltip-wrap {
    position: relative;
    display: inline-block;
  }

  button {
    padding: 10px 16px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    background: #333;
    color: white;
    cursor: pointer;
  }

  .tooltip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);

    background: #222;
    color: white;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    margin-bottom: 5px;
  }

  .tooltip-wrap:hover .tooltip {
    opacity: 1;
  }
</style>
</head>
<body>

  <div class="tooltip-wrap">
    <button>Hover me</button>
    <span class="tooltip">This is a tooltip</span>
  </div>

</body>
</html>
